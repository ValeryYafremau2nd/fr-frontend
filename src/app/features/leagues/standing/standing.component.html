
<scroll-view>
  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<table *ngFor="let standing of standings" class="table">
    <thead>
      <tr *ngIf="standing._id"><td colspan=8 align="center" class="standing-header">{{ standing._id.replace('_', ' ') }}</td></tr>
      <tr>
        <th>#</th>
        <th>Team</th>
        <th>Matches</th>
        <th>Wins</th>
        <th>Draws</th>
        <th>Loses</th>
        <th>Points</th>
        <th>Track</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let position of standing.table; let i = index">
        <th scope="row">{{ i + 1 }}</th>
        <td class="team-link">{{ position.team.name }}</td>
        <td>{{ position.playedGames }}</td>
        <td>{{ position.won }}</td>
        <td>{{ position.draw }}</td>
        <td>{{ position.lost }}</td>
        <td>{{ position.points }}</td>
        <td class="col-track"><app-track
            [itemId]="position.team.id"
            [tracker]="trackTeam.bind(this)"
            [untracker]="untrackTeam.bind(this)"
            [tracked]="position.trackedTeam"
          ></app-track></td>
      </tr>
    </tbody>
  </table>
</scroll-view>
