<app-filter></app-filter>
<scroll-view>
  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<div *ngFor="let matchDay of matchDays">
  <div class="match-day">{{ matchDay._id | date }}</div>
  <table class="table">
    <tbody>
      <tr [ngClass]="{'finished': match.status === 'FINISHED', 'postponed': match.status === 'POSTPONED'}" *ngFor="let match of matchDay.matches">
        <td class="col-competition"><img [src]="match.emblemUrl"/></td>
        <th class="col-date">{{ match.utcDate | date:'HH:mm' }}</th>
        <td class="col-home-team" [ngClass]="{'tracked-team': match.homeTeam.tracked}">{{ match.homeTeam.name }}</td>
        <td class="col-home-team-score">{{ match.score.fullTime.homeTeam }}</td>
        <td class="col-separator">:</td>
        <td class="col-away-team-score">{{ match.score.fullTime.awayTeam }}</td>
        <td class="col-away-team" [ngClass]="{'tracked-team': match.awayTeam.tracked}">{{ match.awayTeam.name }}</td>
        <td class="col-track"><app-track
          [itemId]="match.id"
          [tracker]="trackMatch.bind(this)"
          [untracker]="untrackMatch.bind(this)"
          [tracked]="match.tracked"
          style="float:right;width:100%"
        ></app-track></td>
      </tr>
    </tbody>
  </table>
</div>
</scroll-view>
